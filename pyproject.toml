[project]
name = "resnet18_ddp"
version = "0.1.0"
description = "ResNet18 DDP"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "matplotlib>=3.11.1",
    "tensorboard>=2.21.0",
    "torch>=2.13.0",
    "torch-tb-profiler>=0.4.3",
    "torchvision>=0.28.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true